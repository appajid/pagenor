[package]
name = "pagenor-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pagenor engine: session, documents, history, selection, command registry, tool hosting"

[lints]
workspace = true

[dependencies]
pagenor-images = { workspace = true }
pagenor-geom = { workspace = true }
pagenor-color = { workspace = true }
pagenor-doc = { workspace = true }
pagenor-fonts = { workspace = true }
pagenor-compose = { workspace = true }
pagenor-render = { workspace = true }
pagenor-format = { workspace = true }
pagenor-epub = { workspace = true }
pagenor-textimport = { workspace = true }
pagenor-pdf = { workspace = true }
pagenor-tools = { workspace = true }
pagenor-idml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
quick-xml = { workspace = true }
caseless = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = { workspace = true }

[dev-dependencies]
pagenor-fonts = { workspace = true, features = ["testing"] }
zip = { workspace = true }
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
