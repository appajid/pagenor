[package]
name = "pagenor-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pagenor renderer: spreads, pages, frames, composed text and images to pixels (vello_cpu)"

[lints]
workspace = true

[dependencies]
pagenor-geom = { workspace = true }
pagenor-color = { workspace = true }
pagenor-doc = { workspace = true }
pagenor-fonts = { workspace = true }
pagenor-compose = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
hayro = { workspace = true }
pagenor-images = { workspace = true }
log = { workspace = true }
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
