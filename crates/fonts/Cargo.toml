[package]
name = "pagenor-fonts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pagenor fonts: font database (bundled OFL + system), metrics, glyph outlines, shaping"

[lints]
workspace = true

[features]
# Synthetic fonts for other crates' tests (`pagenor_fonts::testing`).
testing = []

[dependencies]
kurbo = { workspace = true }
skrifa = { workspace = true }
harfrust = { workspace = true }
unicode-bidi = { workspace = true }
unicode-script = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "22"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
fontconfig = { version = "0.11", features = ["dlopen"] }
fontconfig-parser = "0.5.8"

[dev-dependencies]
fontconfig-parser = "0.5.8"
