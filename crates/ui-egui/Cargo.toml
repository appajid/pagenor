[package]
name = "pagenor-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pagenor egui frontend (InDesign-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
pagenor-ai = { workspace = true }
craft-ui = { workspace = true }
pagenor-geom = { workspace = true }
pagenor-color = { workspace = true }
pagenor-doc = { workspace = true }
pagenor-fonts = { workspace = true }
pagenor-compose = { workspace = true }
pagenor-render = { workspace = true }
pagenor-images = { workspace = true }
pagenor-tools = { workspace = true }
pagenor-engine = { workspace = true }
unicode-bidi = { workspace = true }
unicode-bidi-mirroring = { workspace = true }
unicode-segmentation = { workspace = true }
regex = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
pagenor-idml = { workspace = true }
# Headless (offscreen wgpu) rendering of the whole window for UI screenshots: `examples/ui_shot.rs`.
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
pagenor-fonts = { workspace = true, features = ["testing"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
