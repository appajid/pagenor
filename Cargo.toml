[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/pagenor", "apps/pagenor-cli", "xtask"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/appajid/pagenor"

[workspace.dependencies]
# internal
pagenor-archive = { path = "crates/archive" }
pagenor-ai = { path = "crates/ai" }
pagenor-geom = { path = "crates/geom" }
pagenor-color = { path = "crates/color" }
pagenor-doc = { path = "crates/doc" }
pagenor-fonts = { path = "crates/fonts" }
pagenor-compose = { path = "crates/compose" }
pagenor-images = { path = "crates/images" }
pagenor-render = { path = "crates/render" }
pagenor-pdf = { path = "crates/pdf" }
pagenor-idml = { path = "crates/idml" }
pagenor-indd = { path = "crates/indd" }
pagenor-epub = { path = "crates/epub" }
pagenor-pptx = { path = "crates/pptx" }
pagenor-textimport = { path = "crates/textimport" }
pagenor-format = { path = "crates/format" }
pagenor-tools = { path = "crates/tools" }
pagenor-engine = { path = "crates/engine" }
pagenor-ui-egui = { path = "crates/ui-egui" }
pagenor-mcp = { path = "crates/mcp" }
pagenor-testkit = { path = "crates/testkit" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-script = "0.5"
unicode-bidi-mirroring = "0.4"
unicode-segmentation = "1"
caseless = "0.2"
tempfile = "3"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
vello_cpu = "0.2"
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
# CMYK TIFF samples for PDF export (`image` decodes them to RGB); the version `image` uses.
tiff = "0.11"
# SVG (same usvg as krilla-svg).
resvg = { version = "0.47", default-features = false, features = ["text"] }
krilla-svg = "0.8"
# Boolean operations on Bézier paths (Pathfinder).
flo_curves = "0.8"
# QR codes (Object › Generate QR Code); MIT.
qrcodegen = "1.8"
krilla = { version = "0.8", features = ["pdf"] }
hayro = "0.7"
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
