name: Windows maintenance verification
'on':
  push:
    branches: [codex/pagenor-0142-windows]
  workflow_dispatch:
    inputs:
      package_run:
        description: 'Reuse packages from this run for verification only (blank builds new packages)'
        type: string
        default: ''
        required: false
      artifact_prefix:
        description: 'Artifact family of the package run being verified'
        type: choice
        options: [windows-maintenance, release-windows]
        default: windows-maintenance
        required: false
      publish:
        description: 'Publish the verified desktop artifacts after all original source/build gates pass'
        type: boolean
        default: false
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-maintenance-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  package:
    if: ${{ inputs.package_run == '' }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - name: Check out pinned release fonts
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.99.0
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc,aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-windows-${{ matrix.arch }}
          cache-on-failure: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build complete package
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-maintenance-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
  verify:
    if: ${{ always() && !cancelled() && (needs.package.result == 'success' || inputs.package_run != '') }}
    needs: package
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            program_files: ProgramFiles
          - arch: x86
            runner: windows-latest
            program_files: ProgramFiles(x86)
          - arch: arm64
            runner: windows-11-arm
            program_files: ProgramFiles
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact_prefix || 'windows-maintenance' }}-${{ matrix.arch }}
          path: dist
          run-id: ${{ inputs.package_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify installer and portable converter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python packaging/tests/pagemaker_fixture.py "$env:RUNNER_TEMP/three-pages.p65"
          if ($LASTEXITCODE -ne 0) { throw 'fixture generation failed' }
          $msi = (Get-ChildItem dist/*.msi | Select-Object -First 1).FullName
          $proc = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw 'MSI installation failed' }
          try {
            $directory = Join-Path ([Environment]::GetEnvironmentVariable('${{ matrix.program_files }}')) 'Pagenor'
            $manifest = Get-Content Cargo.toml -Raw
            $version = [regex]::Match($manifest, '(?ms)^\[workspace\.package\]\s*.*?^version\s*=\s*"([^"]+)"').Groups[1].Value
            if (-not $version) { throw 'workspace version is missing' }
            $machine = @{x64=0x8664; x86=0x14c; arm64=0xaa64}['${{ matrix.arch }}']
            foreach ($exe in 'pagenor.exe', 'pagenor-cli.exe', 'helpers/pmd2raw-byte-v2.exe') {
              $bytes = [IO.File]::ReadAllBytes((Join-Path $directory $exe))
              if ([BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3c) + 4) -ne $machine) { throw "wrong architecture: $exe" }
            }
            $cli = Join-Path $directory 'pagenor-cli.exe'
            $actual = & $cli --version | Out-String
            if ($LASTEXITCODE -ne 0 -or $actual -notmatch [regex]::Escape($version)) { throw "wrong installed version: $actual" }
            & $cli run --sample --export "$env:RUNNER_TEMP/smoke.pdf"
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$env:RUNNER_TEMP/smoke.pdf")) { throw 'installed CLI PDF export failed' }
            foreach ($extension in '.pgnr', '.pagenor') {
              $association = Get-ItemProperty -LiteralPath "Registry::HKEY_LOCAL_MACHINE\Software\Classes\$extension"
              if ($association.'(default)' -ne 'Pagenor.Document') { throw "missing $extension association" }
            }
            $icon = Get-ItemProperty -LiteralPath 'Registry::HKEY_LOCAL_MACHINE\Software\Classes\Pagenor.Document\DefaultIcon'
            if ($icon.'(default)' -notmatch 'pagenor-document.ico') { throw 'incorrect document icon' }
            foreach ($notice in 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE', 'LICENSE-Pagenor-brand.txt', 'LICENSE-Pagenor-app-icon.txt', 'OFL-Inter.txt') {
              if (-not (Test-Path (Join-Path $directory "licenses/$notice"))) { throw "missing installed notice: $notice" }
            }
            Write-Output "ok fresh $version MSI: native ${{ matrix.arch }}, PDF export, associations, document icon, notices"
            ./packaging/windows/verify-pagemaker.ps1 -Directory $directory -Msi $msi -Fixture "$env:RUNNER_TEMP/three-pages.p65"
            Expand-Archive (Get-ChildItem dist/*-portable.zip | Select-Object -First 1).FullName "$env:RUNNER_TEMP/portable"
            $portable = (Get-ChildItem "$env:RUNNER_TEMP/portable" -Directory | Select-Object -First 1).FullName
            ./packaging/windows/verify-pagemaker.ps1 -Directory $portable -Fixture "$env:RUNNER_TEMP/three-pages.p65"
          } finally {
            $proc = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw 'MSI uninstall failed' }
          }
          ./packaging/windows/verify-upgrade.ps1 -Arch ${{ matrix.arch }} -Msi $msi -Directory $directory -Fixture "$env:RUNNER_TEMP/three-pages.p65"

  publish:
    if: ${{ always() && !cancelled() && inputs.publish && needs.verify.result == 'success' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Validate original desktop build gates and unchanged application source
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.package_run }}
          ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
        run: |
          set -euo pipefail
          test "$ARTIFACT_PREFIX" = release-windows
          [[ "$PACKAGE_RUN" =~ ^[0-9]+$ ]]
          gh run watch "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" --interval 30 > "$RUNNER_TEMP/source-build-watch.log"
          gh run view "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,status,jobs,workflowName > "$RUNNER_TEMP/desktop-build.json"
          python3 - <<'PYGATE'
          import json, os, re, tomllib
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'desktop-build.json').read_text())
          required = {'version', 'macOS universal', 'Windows x64', 'Windows x86', 'Windows arm64',
                      'Linux x86_64', 'Linux aarch64', 'Flatpak x86_64', 'Flatpak aarch64',
                      'Quality (macos-15)', 'Quality (windows-latest)', 'Quality (ubuntu-22.04)'}
          passed = {job['name'] for job in data['jobs'] if job['conclusion'] == 'success'}
          if data['workflowName'] != 'Desktop release' or data['status'] != 'completed' or not required <= passed:
              raise SystemExit('Original desktop source/build gates have not all passed: ' + repr(sorted(required - passed)))
          source = data['headSha']
          if not re.fullmatch('[0-9a-f]{40}', source):
              raise SystemExit('Invalid source commit')
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          (Path(os.environ['RUNNER_TEMP']) / 'desktop-source').write_text(source)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'source={source}\nversion={version}\n')
          PYGATE
          source="$(cat "$RUNNER_TEMP/desktop-source")"
          git merge-base --is-ancestor "$source" HEAD
          git diff --name-only "$source" HEAD > "$RUNNER_TEMP/desktop-source-changes"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/desktop-release.yml|.github/workflows/windows-maintenance.yml|packaging/tests/release_packages.py|docs/releases/*.md) ;;
              *) echo "::error::Application source differs from the built artifacts: $path"; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/desktop-source-changes"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
      - name: Publish exact verified desktop artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.gate.outputs.version }}
          SOURCE_SHA: ${{ steps.gate.outputs.source }}
          PACKAGE_RUN: ${{ inputs.package_run }}
        run: |
          set -euo pipefail
          python3 - <<'PYPAYLOAD'
          import os
          from pathlib import Path
          version = os.environ['VERSION']
          expected = {f'pagenor-{version}-macos-universal.dmg', f'pagenor-cli-{version}-macos-universal.zip'}
          expected |= {f'pagenor-{version}-windows-{arch}{suffix}' for arch in ['x64', 'x86', 'arm64'] for suffix in ['.msi', '-portable.zip']}
          expected |= {f'pagenor-{version}-linux-{arch}{suffix}' for arch in ['x86_64', 'aarch64'] for suffix in ['.AppImage', '.AppImage.zsync', '.deb', '.rpm', '.tar.gz', '.flatpak']}
          actual = {p.name for p in Path('dist/release').iterdir() if p.is_file() and p.stat().st_size > 0}
          if actual != expected:
              raise SystemExit('Unexpected/incomplete desktop payloads: ' + repr(sorted(actual ^ expected)))
          text = Path(f'docs/releases/{version}.md').read_text()
          text = text.replace('(../upstream-adoption-20261120.md)', f'(https://github.com/appajid/pagenor/blob/{os.environ["SOURCE_SHA"]}/docs/upstream-adoption-20261120.md)')
          text += f'\nVerified builds: https://github.com/appajid/pagenor/actions/runs/{os.environ["PACKAGE_RUN"]}\n\nWindows MSI/portable/upgrade verification: https://github.com/appajid/pagenor/actions/runs/{os.environ["GITHUB_RUN_ID"]}\n\nArtifacts are built from `{os.environ["SOURCE_SHA"]}`; the verification-only checkout repair does not alter their application source.\n'
          (Path(os.environ['RUNNER_TEMP']) / 'release-notes.md').write_text(text)
          PYPAYLOAD
          (cd dist/release && sha256sum ./* > SHA256SUMS.txt)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION exists; refusing replacement"
            exit 1
          fi
          gh release create "v$VERSION" dist/release/* --target "$SOURCE_SHA" --title "Pagenor $VERSION — desktop development preview" --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"
