# Flatpak manifest for Pagenor, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/org.pagenor.app.yml
#   flatpak run org.pagenor.app
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# The single-file .flatpak attached to each release comes from org.pagenor.app.bundle.yml,
# which repackages the prebuilt release binaries. Keep runtime-version and finish-args identical.
id: org.pagenor.app
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: pagenor
finish-args:
  # The current desktop host uses X11 (including XWayland) for drag delivery.
  - --socket=wayland
  - --socket=x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for egui's renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save, Place and Export go through the file-chooser portal (rfd's xdg-portal backend)
  # and drag-and-drop through the document portal, so picked files work anywhere without broad
  # filesystem access. Documents and Pictures are granted so files passed by path (the command
  # line, Open Recent, linked images placed in a layout) work in the usual places.
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  # Deliberately not granted: network (the optional --control server listens on 127.0.0.1 in
  # the sandbox; `flatpak override --user --share=network org.pagenor.app` exposes it
  # to host agents) and home/host filesystem access.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: pagenor
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/pagenor/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p pagenor -p pagenor-cli
      - install -Dm755 target/release/pagenor /app/bin/pagenor
      - install -Dm755 target/release/pagenor-cli /app/bin/pagenor-cli
      - install -Dm644 packaging/linux/org.pagenor.app.desktop /app/share/applications/org.pagenor.app.desktop
      - install -Dm644 packaging/linux/org.pagenor.app.mime.xml /app/share/mime/packages/org.pagenor.app.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - mkdir -p /app/share/doc/pagenor
      - cp README.md LICENSE-MIT LICENSE-APACHE NOTICE PAGENOR_UPSTREAM.md assets/fonts/OFL-*.txt /app/share/doc/pagenor/
      - cp assets/brand/LICENSE.txt /app/share/doc/pagenor/LICENSE-Pagenor-brand.txt
      - cp assets/app-icon/LICENSE.txt /app/share/doc/pagenor/LICENSE-Pagenor-app-icon.txt
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/org.pagenor.app.metainfo.xml.in > /app/share/metainfo/org.pagenor.app.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
